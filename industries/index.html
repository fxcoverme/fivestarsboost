var SUPPORTED = ["en", "es", "zh", "vi"];
function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}
function detectBrowserLang(){
  try{
    var n = (navigator.language || (navigator.languages && navigator.languages[0]) || "").toLowerCase();
    if(n.indexOf("es") === 0) return "es";
    if(n.indexOf("zh") === 0) return "zh";
    if(n.indexOf("vi") === 0) return "vi";
    if(n.indexOf("en") === 0) return "en";
  }catch(e){}
  return "en";
}
function resolveLang(){
  var p = null;
  try{ p = new URLSearchParams(window.location.search).get("lang"); }catch(e){}
  if(SUPPORTED.indexOf(p) >= 0) return p;
  var s = lsGet("fsb_lang");
  if(SUPPORTED.indexOf(s) >= 0) return s;
  return detectBrowserLang();
}
var LANG = resolveLang();
function T(key){ var d = I18N[LANG]; return (key in d) ? d[key] : I18N.en[key]; }
function applyLang(lang, persist){
  if(SUPPORTED.indexOf(lang) < 0) lang = "en";
  LANG = lang;
  if(persist) lsSet("fsb_lang", lang);
  document.documentElement.lang = (lang === "zh") ? "zh-CN" : lang;
  document.title = T("page_title");
  var md = document.querySelector('meta[name="description"]');
  if(md) md.setAttribute("content", T("page_desc"));
  document.querySelectorAll(".langtoggle button").forEach(function(b){
    b.classList.toggle("active", b.getAttribute("data-lang") === lang);
  });
  document.querySelectorAll("[data-i18n]").forEach(function(el){
    var v = T(el.getAttribute("data-i18n"));
    if(typeof v === "string") el.textContent = v;
  });
  document.querySelectorAll("[data-i18n-html]").forEach(function(el){
    var v = T(el.getAttribute("data-i18n-html"));
    if(typeof v === "string") el.innerHTML = v;
  });
}
document.addEventListener("DOMContentLoaded", function(){
  document.querySelectorAll(".langtoggle button").forEach(function(b){
    b.addEventListener("click", function(){ applyLang(b.getAttribute("data-lang"), true); });
  });
  applyLang(LANG);
});
</script>
